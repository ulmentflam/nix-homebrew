name: Update brew-src

on:
  schedule:
    # 3x daily (06:00, 14:00, 22:00 UTC)
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: samueldr/lix-gha-installer-action@v2025-10-27

      - name: Resolve latest Homebrew release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          version=$(gh api repos/Homebrew/brew/releases/latest --jq '.tag_name')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest upstream release: $version"

      - name: Read currently pinned version
        id: current
        run: |
          set -Eeuo pipefail
          version=$(jq -r '.nodes."brew-src".original.ref' flake.lock)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Currently pinned: $version"

      - name: Decide whether to update
        id: check
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.latest.outputs.version }}
        run: |
          set -Eeuo pipefail
          if [[ "$OLD" == "$NEW" ]]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date at $OLD"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "Will update: $OLD -> $NEW"
          fi

      - name: Bump ref in flake.nix
        if: steps.check.outputs.needs_update == 'true'
        env:
          OLD: ${{ steps.current.outputs.version }}
          NEW: ${{ steps.latest.outputs.version }}
        run: |
          set -Eeuo pipefail
          sed -i "s|github:Homebrew/brew/${OLD}|github:Homebrew/brew/${NEW}|" flake.nix

      - name: Update flake.lock
        if: steps.check.outputs.needs_update == 'true'
        run: nix flake update brew-src

      - name: Regenerate modules/brew.tail.sh
        if: steps.check.outputs.needs_update == 'true'
        run: |
          set -Eeuo pipefail
          BREW_SRC=$(nix flake archive --json | jq -r '.inputs."brew-src".path')
          export BREW_SRC
          bash scripts/update-brew-tail.sh

      - name: Open pull request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BREW_UPDATE_TOKEN }}
          branch: brew-src-update-${{ steps.latest.outputs.version }}
          delete-branch: true
          commit-message: "chore(deps): upgrade brew-src to ${{ steps.latest.outputs.version }}"
          title: "chore(deps): upgrade brew-src to ${{ steps.latest.outputs.version }}"
          body: |
            Auto-generated by [`update-brew.yaml`](.github/workflows/update-brew.yaml).

            Bumps `brew-src` from `${{ steps.current.outputs.version }}` to `${{ steps.latest.outputs.version }}`.

            Upstream release: https://github.com/Homebrew/brew/releases/tag/${{ steps.latest.outputs.version }}
          labels: |
            dependencies
            automated
